name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Unit tests only: Supabase and Groq are mocked, so no secrets are needed.
      # The LLM safety eval (evals/run_safety_eval.py) calls Groq and is run by hand.
      - run: pytest -v
